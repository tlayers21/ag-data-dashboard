services:
  api:
    build: .
    image: ag-data-api:latest
    container_name: ag-data-api
    restart: unless-stopped
    ports:
      - "${API_BIND_ADDR:-127.0.0.1}:${API_PORT:-8000}:${API_PORT:-8000}"
    env_file: .env
    healthcheck:
      # python, not curl - the slim base image has no curl
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:${API_PORT:-8000}/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
