[project]
name = "ag-data-dashboard"
version = "1.0.0"
description = "Automated USDA ESR / PSD / Export Inspections analytics platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pandas>=2.2,<3",
    "plotly>=6,<7",
    "sqlalchemy>=2.0,<2.1",
    "psycopg2-binary",
    "requests",
    "python-dotenv",
]

[dependency-groups]
pipeline = ["prefect"]
dev = ["jupyter", "ipykernel"]

[tool.uv]
package = false
default-groups = ["dev", "pipeline"]
